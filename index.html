<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Glint Product and Brand Development Guide</title>
    <link href="dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* High-prominence, 3x thick exit icon in the dFlip control bar */
        .df-ui-btn.df-custom-exit {
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 16px !important;
            font-weight: 900 !important;
            color: #111111 !important;
            opacity: 1 !important;
            
            /* Triple-weight stroke effect across webkit and standard text renderers */
            -webkit-text-stroke: 1.2px #111111;
            text-shadow: 0 0 1px #111111, 0 0 1px #111111;
            
            border-left: 1px solid rgba(0, 0, 0, 0.15) !important;
            padding: 0 12px !important;
            margin-left: 6px !important;
            transition: transform 0.15s ease, color 0.15s ease, -webkit-text-stroke 0.15s ease;
        }

        .df-ui-btn.df-custom-exit:hover {
            color: #d32f2f !important;
            -webkit-text-stroke: 1.2px #d32f2f;
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <!-- DearFlip Container -->
    <div 
        class="_df_book" 
        source="Glint-Product-Brand-Guide.pdf" 
        id="df_manual_book"
        webgl="false"
        three-d-book="false"
    ></div>

    <script src="dflip/js/libs/jquery.min.js" type="text/javascript"></script>
    <script src="dflip/js/dflip.min.js" type="text/javascript"></script>

    <script>
        function handleExit() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "https://yourportfoliodomain.com";
            }
        }

        $(document).ready(function() {
            var checkCount = 0;
            var pollInterval = setInterval(function() {
                var $controls = $('.df-ui-controls');
                if ($controls.length && !$('.df-custom-exit').length) {
                    var $exitBtn = $(
                        '<div class="df-ui-btn ti-close df-custom-exit" ' +
                        'title="Close & Back to Portfolio"></div>'
                    );

                    $exitBtn.on('click', function(e) {
                        e.preventDefault();
                        handleExit();
                    });

                    $controls.append($exitBtn);
                    clearInterval(pollInterval);
                }
                checkCount++;
                if (checkCount > 50) clearInterval(pollInterval);
            }, 200);
        });
    </script>
</body>
</html>
