<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Glint Product and Brand Development Guide</title>
    <link href="dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* Styling for the custom exit button in the toolbar */
        .df-ui-btn.df-custom-exit {
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }
        .df-ui-btn.df-custom-exit:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div 
        class="_df_book" 
        source="Glint-Product-Brand-Guide.pdf" 
        id="df_manual_book"
        webgl="false"
        three-d-book="false"
    ></div>

    <script src="dflip/js/libs/jquery.min.js" type="text/javascript"></script>
    <script src="dflip/js/dflip.min.js" type="text/javascript"></script>

    <script>
        var option_df_manual_book = {
            enableDownload: false,
            onFlipbookInit: function(dflip) {
                // Wait for controls to render, then append the exit button
                setTimeout(function() {
                    var $controls = $('.df-ui-controls');
                    if ($controls.length && !$('.df-custom-exit').length) {
                        var exitBtn = $(
                            '<div class="df-ui-btn ti-close df-custom-exit" ' +
                            'title="Back to Portfolio" ' +
                            'style="border-left: 1px solid rgba(0,0,0,0.1); padding-left: 8px; margin-left: 4px;"></div>'
                        );

                        exitBtn.on('click', function() {
                            // If opened directly or in same tab, returns to previous page
                            if (window.history.length > 1) {
                                window.history.back();
                            } else {
                                // Fallback URL if opened in a fresh tab
                                window.location.href = "https://yourportfoliodomain.com"; 
                            }
                        });

                        $controls.append(exitBtn);
                    }
                }, 400);
            }
        };
    </script>
</body>
</html>
